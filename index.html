    <style>
      html,
      body {
        margin: 0;
        background: #07080d;
      }
      /* Boot screen shown before the bundle runs; the app takes it over (see src/ui/Boot.tsx). */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07080d center / cover no-repeat;
        color: #c9d4ff;
        font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        transition: opacity 0.6s ease;
        z-index: 50;
      }
      #boot::before {
        content: "";
        position: absolute;
        inset: -40px;
        background: url(/images/still.jpg) center / cover no-repeat;
        filter: blur(18px) brightness(0.45) saturate(1.1);
      }
      #boot .tv {
        position: relative;
        padding: 14px 18px;
        background: #1f3fbf;
        box-shadow: 0 0 0 10px #15151a, 0 0 60px rgba(60, 90, 255, 0.35);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="tv">LOADING&hellip;</div></div>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #eee; font-family: system-ui, sans-serif">
        <h1>Nithishhariharan M</h1>
        <p>Tech-driven and motivated student skilled in software development, VR simulations, and blockchain systems.</p>
        <p>
          <a href="/resume/Nithishhariharan-M-Resume.pdf" style="color: #9cf">Résumé (PDF)</a> ·
          <a href="https://github.com/nithish008888" style="color: #9cf">GitHub</a> ·
          <a href="mailto:Nith9677@gmail.com" style="color: #9cf">Email</a>
        </p>
        <p>The interactive room needs JavaScript and WebGL.</p>
      </main>
      <style>#boot{display:none}</style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
